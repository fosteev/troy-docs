<title>Города и территории Troy</title>
<style>
  :root {
    --bg: #f4f5f9; --panel: #ffffff; --panel-2: #fafafd; --border: #e6e7ee; --border-strong: #cfd2df;
    --text: #1c1d2b; --text-2: #5f6274; --text-3: #8e91a3;
    --primary: #5b6cf0; --primary-hover: #4a5be0; --primary-soft: #eef0fe;
    --danger: #e5484d; --danger-soft: #fdecec; --warn: #c98a00; --warn-soft: #fff4d6; --ok: #2f9e5a; --ok-soft: #e6f6ec;
    --map-ground: #eef0ea; --map-road: #ffffff; --map-water: #cfe3f2; --map-block: #e3e6dc; --hex-empty: rgba(28,29,43,.06);
    --radius: 8px; --shadow: 0 8px 28px rgba(28,29,43,.12);
    --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", sans-serif;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #12131b; --panel: #1b1c27; --panel-2: #20212e; --border: #2b2d3d; --border-strong: #3c3f55;
      --text: #e9eaf2; --text-2: #a5a8bb; --text-3: #767a90;
      --primary: #7d8cff; --primary-hover: #91a0ff; --primary-soft: #262a48;
      --danger: #ff6b70; --danger-soft: #3a2224; --warn: #e8b23a; --warn-soft: #3a3120; --ok: #4cc27a; --ok-soft: #1f3629;
      --map-ground: #1f2129; --map-road: #2c2f3b; --map-water: #1d2b3c; --map-block: #262a33; --hex-empty: rgba(233,234,242,.07);
      --shadow: 0 8px 28px rgba(0,0,0,.5);
    }
  }
  :root[data-theme="dark"] {
    --bg: #12131b; --panel: #1b1c27; --panel-2: #20212e; --border: #2b2d3d; --border-strong: #3c3f55;
    --text: #e9eaf2; --text-2: #a5a8bb; --text-3: #767a90;
    --primary: #7d8cff; --primary-hover: #91a0ff; --primary-soft: #262a48;
    --danger: #ff6b70; --danger-soft: #3a2224; --warn: #e8b23a; --warn-soft: #3a3120; --ok: #4cc27a; --ok-soft: #1f3629;
    --map-ground: #1f2129; --map-road: #2c2f3b; --map-water: #1d2b3c; --map-block: #262a33; --hex-empty: rgba(233,234,242,.07);
    --shadow: 0 8px 28px rgba(0,0,0,.5);
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.5715 var(--font); -webkit-font-smoothing: antialiased; }
  button, input, select, textarea { font: inherit; color: inherit; }
  h1, h2, h3, h4 { margin: 0; font-weight: 600; text-wrap: balance; }
  .num { font-variant-numeric: tabular-nums; }
  .mono { font-family: var(--mono); font-size: 12px; }
  .muted { color: var(--text-2); } .faint { color: var(--text-3); }
  .ic { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }

  /* shell — зеркало AdminLayout */
  .app { display: flex; min-height: 100vh; }
  .sider { width: 220px; flex: none; background: var(--panel); border-right: 1px solid var(--border); position: sticky; top: 0; height: 100vh; }
  .brand { height: 64px; display: flex; align-items: center; padding: 0 24px; border-bottom: 1px solid var(--border); font-weight: 600; }
  .menu { padding: 8px; display: flex; flex-direction: column; gap: 4px; }
  .menu a { display: flex; align-items: center; gap: 10px; padding: 8px 16px; border-radius: var(--radius); color: var(--text); text-decoration: none; }
  .menu a:hover { background: var(--panel-2); }
  .menu a.active { background: var(--primary-soft); color: var(--primary); font-weight: 500; }
  .menu .new { margin-left: auto; font-size: 11px; padding: 0 6px; border-radius: 10px; background: var(--primary); color: #fff; line-height: 18px; }
  .menu .sub { margin: 8px 16px 2px; font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--text-3); }
  .main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .header { height: 64px; background: var(--panel); border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; padding: 0 24px; gap: 16px; }
  .header h4 { font-size: 20px; }
  .crumbs { display: flex; align-items: center; gap: 8px; color: var(--text-2); }
  .crumbs a { color: var(--text-2); text-decoration: none; } .crumbs a:hover { color: var(--primary); }
  .content { padding: 24px; display: flex; flex-direction: column; gap: 24px; }

  /* controls */
  .btn { display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 15px; border: 1px solid var(--border-strong); border-radius: var(--radius); background: var(--panel); cursor: pointer; white-space: nowrap; transition: all .15s; }
  .btn:hover { color: var(--primary); border-color: var(--primary); }
  .btn:focus-visible, .seg button:focus-visible, .tabs button:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
  .btn.primary { background: var(--primary); border-color: var(--primary); color: #fff; }
  .btn.primary:hover { background: var(--primary-hover); border-color: var(--primary-hover); }
  .btn.danger { color: var(--danger); border-color: var(--danger); } .btn.danger:hover { background: var(--danger-soft); }
  .btn.link { border-color: transparent; background: transparent; padding: 0 6px; color: var(--primary); height: 24px; } .btn.link:hover { background: var(--primary-soft); }
  .btn.sm { height: 24px; padding: 0 8px; font-size: 12px; }
  .btn[disabled] { opacity: .45; cursor: not-allowed; }
  .btn.on { background: var(--primary-soft); border-color: var(--primary); color: var(--primary); }
  .seg { display: inline-flex; border: 1px solid var(--border-strong); border-radius: var(--radius); overflow: hidden; }
  .seg button { height: 30px; padding: 0 12px; border: 0; background: var(--panel); cursor: pointer; border-right: 1px solid var(--border-strong); }
  .seg button:last-child { border-right: 0; }
  .seg button.on { background: var(--primary-soft); color: var(--primary); font-weight: 500; }
  .input, select.input { height: 32px; padding: 0 11px; border: 1px solid var(--border-strong); border-radius: var(--radius); background: var(--panel); width: 100%; }
  .input:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 2px var(--primary-soft); }
  .field { display: flex; flex-direction: column; gap: 6px; }
  .field label { font-size: 13px; color: var(--text-2); }
  .field .hint { font-size: 12px; color: var(--text-3); }
  .form { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px 24px; max-width: 720px; }
  .form .full { grid-column: 1 / -1; }
  .switch { width: 44px; height: 22px; border-radius: 11px; background: var(--border-strong); border: 0; position: relative; cursor: pointer; padding: 0; }
  .switch::after { content: ""; position: absolute; top: 2px; left: 2px; width: 18px; height: 18px; border-radius: 50%; background: #fff; transition: left .15s; }
  .switch.on { background: var(--primary); } .switch.on::after { left: 24px; }
  .range { width: 100%; accent-color: var(--primary); }

  /* tags */
  .tag { display: inline-flex; align-items: center; gap: 6px; height: 22px; padding: 0 8px; border-radius: 4px; font-size: 12px; border: 1px solid var(--border); background: var(--panel-2); white-space: nowrap; }
  .tag .dot { width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
  .tag.ok { color: var(--ok); background: var(--ok-soft); border-color: transparent; }
  .tag.warn { color: var(--warn); background: var(--warn-soft); border-color: transparent; }
  .tag.off { color: var(--text-3); }
  .tag.draft { color: var(--text-2); border-style: dashed; background: transparent; }

  /* cards, stats, tables */
  .card { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); }
  .card .hd { padding: 12px 20px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; gap: 12px; font-weight: 500; }
  .card .bd { padding: 20px; }
  .stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; }
  .stat { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px 20px; }
  .stat .lbl { color: var(--text-2); font-size: 13px; }
  .stat .val { font-size: 24px; line-height: 1.3; margin-top: 2px; }
  .stat .val small { font-size: 13px; color: var(--text-3); margin-left: 4px; }
  .stat .sub { font-size: 12px; color: var(--text-3); margin-top: 2px; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 10px 16px; border-bottom: 1px solid var(--border); vertical-align: middle; }
  th { font-weight: 500; color: var(--text-2); background: var(--panel-2); font-size: 13px; white-space: nowrap; }
  tbody tr { cursor: pointer; } tbody tr:hover td { background: var(--panel-2); }
  tbody tr.sel td { background: var(--primary-soft); }
  td.r, th.r { text-align: right; }
  .tw { overflow-x: auto; }
  .bar { height: 6px; border-radius: 3px; background: var(--border); overflow: hidden; width: 90px; display: inline-block; vertical-align: middle; margin-right: 8px; }
  .bar i { display: block; height: 100%; background: var(--primary); }
  .empty { padding: 40px; text-align: center; color: var(--text-3); }
  .alert { display: flex; gap: 10px; padding: 10px 14px; border-radius: var(--radius); border: 1px solid; font-size: 13px; }
  .alert.warn { color: var(--warn); border-color: var(--warn); background: var(--warn-soft); }
  .alert.info { color: var(--primary); border-color: var(--primary); background: var(--primary-soft); }

  /* tabs */
  .tabs { display: flex; gap: 0; border-bottom: 1px solid var(--border); padding: 0 20px; }
  .tabs button { border: 0; background: transparent; padding: 12px 0; margin-right: 32px; cursor: pointer; color: var(--text-2); border-bottom: 2px solid transparent; margin-bottom: -1px; }
  .tabs button.on { color: var(--primary); border-bottom-color: var(--primary); font-weight: 500; }
  .tabs button[disabled] { color: var(--text-3); cursor: not-allowed; }

  /* map */
  .maplayout { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 20px; }
  .map { position: relative; border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; background: var(--map-ground); aspect-ratio: 14 / 9; }
  .map svg { display: block; width: 100%; height: 100%; }
  .map .toolbar { position: absolute; top: 12px; left: 12px; display: flex; gap: 8px; z-index: 2; flex-wrap: wrap; }
  .map .toolbar .btn { box-shadow: 0 2px 8px rgba(0,0,0,.12); }
  .map .scale { position: absolute; bottom: 10px; left: 12px; font-size: 11px; color: var(--text-2); background: var(--panel); padding: 2px 6px; border-radius: 4px; border: 1px solid var(--border); }
  .map .tip { position: absolute; pointer-events: none; background: var(--panel); border: 1px solid var(--border); border-radius: 6px; box-shadow: var(--shadow); padding: 8px 10px; font-size: 12px; z-index: 3; min-width: 160px; transform: translate(12px, 12px); }
  .map .tip b { display: block; margin-bottom: 2px; }
  .hex { stroke: rgba(28,29,43,.28); stroke-width: 1; cursor: pointer; transition: fill-opacity .12s; }
  :root[data-theme="dark"] .hex { stroke: rgba(0,0,0,.45); }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .hex { stroke: rgba(0,0,0,.45); } }
  .hex.none { fill: var(--hex-empty); }
  .hex:hover { stroke-width: 2; stroke: var(--text); }
  .hex.sel { stroke: var(--text); stroke-width: 2.5; }
  .boundary { fill: none; stroke: var(--text); stroke-width: 2; stroke-dasharray: 8 5; }
  .vtx { fill: var(--panel); stroke: var(--primary); stroke-width: 2; cursor: grab; }
  .spawn { fill: var(--text); stroke: var(--panel); stroke-width: 1.2; pointer-events: none; }
  .side { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
  .legend { display: flex; flex-direction: column; gap: 2px; max-height: 360px; overflow: auto; }
  .legend button { display: flex; align-items: center; gap: 10px; padding: 6px 8px; border: 1px solid transparent; border-radius: 6px; background: transparent; cursor: pointer; text-align: left; width: 100%; }
  .legend button:hover { background: var(--panel-2); }
  .legend button.on { border-color: var(--primary); background: var(--primary-soft); }
  .legend .sw { width: 14px; height: 14px; border-radius: 3px; flex: none; border: 1px solid rgba(0,0,0,.15); }
  .legend .n { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .legend .c { color: var(--text-3); font-size: 12px; }
  .kv { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; font-size: 13px; }
  .kv dt { color: var(--text-2); } .kv dd { margin: 0; }

  /* drawer / modal */
  .overlay { position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 20; display: flex; justify-content: flex-end; }
  .overlay.center { align-items: center; justify-content: center; }
  .drawer { width: 720px; max-width: 100%; height: 100%; background: var(--panel); box-shadow: var(--shadow); display: flex; flex-direction: column; }
  .modal { width: 880px; max-width: calc(100% - 32px); max-height: calc(100% - 32px); background: var(--panel); border-radius: var(--radius); box-shadow: var(--shadow); display: flex; flex-direction: column; overflow: hidden; }
  .dhd { padding: 16px 24px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .dhd h3 { font-size: 16px; }
  .dbd { padding: 24px; overflow: auto; display: flex; flex-direction: column; gap: 20px; flex: 1; }
  .dft { padding: 12px 24px; border-top: 1px solid var(--border); display: flex; justify-content: flex-end; gap: 8px; }
  .x { border: 0; background: transparent; cursor: pointer; padding: 4px; color: var(--text-2); border-radius: 4px; } .x:hover { background: var(--panel-2); }
  .chk { display: flex; align-items: center; gap: 8px; padding: 4px 0; }
  .chk input { accent-color: var(--primary); }
  .mobs { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 4px 20px; }

  /* notes panel */
  .notes { width: 460px; max-width: 100%; height: 100%; background: var(--panel); box-shadow: var(--shadow); display: flex; flex-direction: column; }
  .notes .dbd { gap: 16px; }
  .notes h4 { font-size: 14px; margin-top: 8px; }
  .notes p, .notes li { font-size: 13px; color: var(--text-2); margin: 0; }
  .notes ul { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 4px; }
  .tree { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .tree div { border: 1px solid var(--border); border-radius: 6px; padding: 10px; font-size: 12px; }
  .tree b { display: block; font-size: 13px; margin-bottom: 4px; }
  .pill { display: inline-block; padding: 0 6px; border-radius: 10px; background: var(--primary-soft); color: var(--primary); font-size: 11px; line-height: 18px; }
  .toast { position: fixed; top: 16px; left: 50%; transform: translateX(-50%); background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); padding: 8px 16px; z-index: 50; display: flex; gap: 8px; align-items: center; }
  .toast .ic { color: var(--ok); }
  @media (max-width: 1100px) { .stats { grid-template-columns: repeat(2, 1fr); } .maplayout { grid-template-columns: 1fr; } .form { grid-template-columns: 1fr; } }
  @media (max-width: 760px) { .sider { display: none; } }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<script>
// ---------- данные (имена и уровни — из prisma/seed.ts) ----------
const TYPE_META = {
  PLAINS:   { label: 'Равнина', color: '#d99000' },
  FOREST:   { label: 'Лес',     color: '#1f9e5a' },
  MOUNTAIN: { label: 'Горы',    color: '#6f5bb5' },
  SWAMP:    { label: 'Болото',  color: '#3d8fa3' },
  CITY:     { label: 'Город',   color: '#b5566f' },
  RUINS:    { label: 'Руины',   color: '#8a7a5c' },
};
const MONSTERS = {
  slime: 'Slime · 1', rat: 'Forest Rat · 1', boar: 'Wild Boar · 2', gscout: 'Goblin Scout · 3', gwar: 'Goblin Warrior · 4',
  wolf: 'Dire Wolf · 5', orc: 'Orc Raider · 6', golem: 'Stone Golem · 8', necro: 'Necromancer Acolyte · 9', drake: 'Drake Whelp · 10',
};
const ZONES = [
  ['Starter Plains','PLAINS',1,3,['slime','rat','boar'],true],
  ['Lantern District','CITY',1,3,['rat','slime','gscout'],true],
  ['Rustling Meadows','PLAINS',1,2,['slime','rat'],false],
  ['Green Forest','FOREST',2,4,['boar','gscout','gwar'],true],
  ['Amber Grove','FOREST',2,4,['boar','gscout'],false],
  ['Willow Marsh','SWAMP',3,5,['gscout','gwar','wolf'],false],
  ['Salt Flats','PLAINS',3,5,['gscout','gwar','wolf'],false],
  ['Broken Aqueduct','RUINS',4,6,['gwar','wolf','orc'],false],
  ['Old Quarry','MOUNTAIN',4,6,['gwar','wolf','orc'],false],

const DEFAULT_CAP = 2;
const zoneById = id => ZONES.find(z => z.id === id);

// Карта прототипа: 1 px = 5 м. Город 7 × 4.5 км укладывается в viewBox 1400 × 900.
const MPP = 5;
const VB = { w: 1400, h: 900 };
const CITIES = [

    zoneIds: ['z01','z02','z04','z06','z08','z09','z11','z15'], territories: null, updated: '10.09.2026' },

  { id: 'spb', name: 'Санкт-Петербург', active: false, hex: 300, seed: 1,

function circlePoly(cx, cy, r, n = 32) {
  return Array.from({ length: n }, (_, k) => { const a = (k / n) * Math.PI * 2; return [+(cx + r * Math.cos(a)).toFixed(1), +(cy + r * Math.sin(a)).toFixed(1)]; });
}

// ---------- геометрия ----------
function mulberry(seed) { let a = seed >>> 0; return () => { a = (a + 0x6D2B79F5) >>> 0; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
function inPoly(x, y, poly) {

    const [xi, yi] = poly[i], [xj, yj] = poly[j];

}

function splitCity(city) {
  if (!city.boundary) return [];
  const s = city.hex / MPP, w = Math.sqrt(3) * s, vstep = 1.5 * s;
  const xs = city.boundary.map(p => p[0]), ys = city.boundary.map(p => p[1]);
  const minX = Math.min(...xs), maxX = Math.max(...xs), minY = Math.min(...ys), maxY = Math.max(...ys);

  for (let j = Math.floor(minY / vstep) - 1; j * vstep <= maxY + vstep; j++) {
    for (let i = Math.floor(minX / w) - 1; i * w <= maxX + w; i++) {

// Раздача: farthest-point sampling выбирает центр для каждой зоны, сота уходит ближайшему.
function assignZones(terr, zoneIds, seed) {
  terr.forEach(t => (t.zoneId = null));
  if (!terr.length || !zoneIds.length) return;
  const rnd = mulberry(seed);
  const order = [...zoneIds].sort(() => rnd() - 0.5);
  const centers = [terr[Math.floor(rnd() * terr.length)]];
  while (centers.length < order.length && centers.length < terr.length) {
    let best = null, bestD = -1;
    for (const t of terr) { let d = Infinity; for (const c of centers) d = Math.min(d, (t.cx - c.cx) ** 2 + (t.cy - c.cy) ** 2); if (d > bestD) { bestD = d; best = t; } }
    centers.push(best);

  for (const t of terr) { let k = 0, bd = Infinity; centers.forEach((c, idx) => { const d = (t.cx - c.cx) ** 2 + (t.cy - c.cy) ** 2; if (d < bd) { bd = d; k = idx; } }); t.zoneId = order[k]; }

  const hexes = terr.map(t => { const f = fillOf(t); return `<polygon class="hex ${f ? '' : 'none'} ${S.selT === t.id ? 'sel' : ''}" data-id="${t.id}" points="${hexPts(t.cx, t.cy, s).map(p => p.map(v => v.toFixed(1)).join(',')).join(' ')}" ${f ? `fill="${f}" fill-opacity="${zoneById(t.zoneId).active ? .62 : .25}"` : ''}/>`; }).join('');
  const spawns = S.showSpawns ? terr.flatMap(t => spawnsFor(c, t)).map(p => `<circle class="spawn" cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="3.2"/>`).join('') : '';
  const inCity = ZONES.filter(z => terr.some(t => t.zoneId === z.id));
  const legend = ZONES.map(z => { const n = terr.filter(t => t.zoneId === z.id).length; return `<button class="${S.brush === z.id ? 'on' : ''}" onclick="pickBrush('${z.id}')"><span class="sw" style="background:${z.color}"></span><span class="n">${esc(z.name)}${z.active ? '' : ' <span class="faint">(выкл.)</span>'}</span><span class="c num">${n || ''}</span></button>`; }).join('');
  const sel = S.selT && terr.find(t => t.id === S.selT);
  return `<div class="maplayout"><div class="map" id="map">
      <div class="toolbar">
        <div class="seg"><button class="${S.tool === 'select' ? 'on' : ''}" onclick="S.tool='select';render()" title="Выбор"><svg class="ic"><use href="#i-cursor"/></svg></button><button class="${S.tool === 'brush' ? 'on' : ''}" onclick="S.tool='brush';if(!S.brush)S.brush='none';render()" title="Кисть: зона из легенды"><svg class="ic"><use href="#i-brush"/></svg></button></div>
        <div class="seg"><button class="${S.paint === 'zone' ? 'on' : ''}" onclick="S.paint='zone';render()">По зоне</button><button class="${S.paint === 'type' ? 'on' : ''}" onclick="S.paint='type';render()">По типу</button><button class="${S.paint === 'level' ? 'on' : ''}" onclick="S.paint='level';render()">По уровню</button></div>
        <button class="btn sm ${S.showSpawns ? 'on' : ''}" onclick="S.showSpawns=!S.showSpawns;render()"><svg class="ic"><use href="#i-eye"/></svg>Спауны</button>
      </div>
      <svg viewBox="0 0 ${VB.w} ${VB.h}" id="hexsvg">${mapGround()}<polygon class="boundary" points="${c.boundary.map(p => p.join(',')).join(' ')}"/><g id="hexes">${hexes}</g><g>${spawns}</g></svg>
      <div class="scale">— 500 м · сота ${c.hex} м</div><div class="tip" id="tip" hidden></div></div>
    <div class="side">
      <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn primary" onclick="openAssign('${c.id}')"><svg class="ic"><use href="#i-dice"/></svg>Раздать зоны</button><button class="btn" onclick="splitCityUI('${c.id}')"><svg class="ic"><use href="#i-grid"/></svg>Перерезать соты</button></div>
      <div class="card"><div class="hd">Территории<span class="muted num" style="font-weight:400">${st.assigned} / ${st.terr} · ${fmtKm2(hexAreaKm2(c.hex))} км² каждая</span></div><div class="bd" style="padding:12px">
        <div class="legend">
          <button class="${S.brush === 'none' ? 'on' : ''}" onclick="pickBrush('none')"><span class="sw" style="background:var(--hex-empty)"></span><span class="n">Без зоны — мобов нет</span><span class="c num">${st.terr - st.assigned || ''}</span></button>
          ${legend}</div>
        <div class="hint" style="margin-top:8px;font-size:12px;color:var(--text-3)">${S.tool === 'brush' ? 'Кисть: клик или протяжка по сотам красит их выбранной зоной.' : 'Клик по зоне в списке включает кисть. Клик по соте показывает её.'}</div>
      </div></div>
      ${sel ? `<div class="card"><div class="hd">Сота ${sel.i}:${sel.j}<button class="x" onclick="S.selT=null;render()"><svg class="ic"><use href="#i-close"/></svg></button></div><div class="bd" style="padding:12px 16px"><dl class="kv">
        <dt>Зона</dt><dd>${sel.zoneId ? esc(zoneById(sel.zoneId).name) + ' ' + typeTag(zoneById(sel.zoneId).type) : '<span class="faint">без зоны</span>'}</dd>
        <dt>Спаунов / нед.</dt><dd class="num">${sel.zoneId ? zoneCap(zoneById(sel.zoneId)) : 0}</dd>
        <dt>Центр</dt><dd class="mono">55.76${String(sel.j).padStart(2, '0')}, 37.5${String(700 + sel.i).slice(-3)}</dd>
        <dt>Площадь</dt><dd class="num">${fmtKm2(hexAreaKm2(c.hex))} км²</dd></dl>
        <div style="margin-top:10px"><select class="input" onchange="setZone('${c.id}','${sel.id}',this.value)"><option value="">— без зоны —</option>${ZONES.map(z => `<option value="${z.id}" ${sel.zoneId === z.id ? 'selected' : ''}>${esc(z.name)} · ${z.min}–${z.max}</option>`).join('')}</select></div></div></div>` : ''}
      <div style="display:flex;gap:8px"><button class="btn primary" onclick="toast('Раздача сохранена: PUT /admin/cities/${c.id}/territories')">Сохранить раздачу</button><button class="btn" onclick="render()">Отменить</button></div>
    </div></div>`;
}
function pickBrush(z) { S.brush = z; S.tool = 'brush'; render(); }
function setZone(cid, tid, zid) { const c = CITIES.find(x => x.id === cid); const t = c.territories.find(x => x.id === tid); t.zoneId = zid || null; render(); }
function afterCity(c) {
  const svg = document.getElementById('hexsvg'); if (!svg) return;
  const tip = document.getElementById('tip'), map = document.getElementById('map');
  let down = false;
  const paint = el => { if (!el || !el.dataset.id) return; const t = c.territories.find(x => x.id === el.dataset.id); const z = S.brush === 'none' ? null : S.brush; if (t.zoneId !== z) { t.zoneId = z; render(); } };
  svg.addEventListener('pointerdown', e => { const el = e.target.closest('.hex'); if (!el) return; if (S.tool === 'brush') { down = true; paint(el); } else { S.selT = el.dataset.id; render(); } });
  svg.addEventListener('pointerover', e => { const el = e.target.closest('.hex'); if (down && el) paint(el); });
  window.addEventListener('pointerup', () => (down = false), { once: true });
  svg.addEventListener('pointermove', e => {
    const el = e.target.closest('.hex'); if (!el) { tip.hidden = true; return; }
    const t = c.territories.find(x => x.id === el.dataset.id), z = t.zoneId && zoneById(t.zoneId), r = map.getBoundingClientRect();
    tip.hidden = false; tip.style.left = (e.clientX - r.left) + 'px'; tip.style.top = (e.clientY - r.top) + 'px';
    tip.innerHTML = z ? `<b>${esc(z.name)}</b>${TYPE_META[z.type].label} · ${z.min}–${z.max} ур.<br><span class="muted">${zoneCap(z)} спауна/нед. · сота ${t.i}:${t.j}</span>` : `<b>Без зоны</b><span class="muted">сота ${t.i}:${t.j} — мобов не будет</span>`;
  });
  svg.addEventListener('pointerleave', () => (tip.hidden = true));
}
function openAssign(cid) {
  const c = CITIES.find(x => x.id === cid); const sel = new Set(c.zoneIds.length ? c.zoneIds : ZONES.filter(z => z.active).map(z => z.id));
  const list = ZONES.map(z => `<label class="chk"><input type="checkbox" name="zs" value="${z.id}" ${sel.has(z.id) ? 'checked' : ''} ${z.active ? '' : 'disabled'}><span class="sw" style="width:12px;height:12px;border-radius:3px;background:${z.color};display:inline-block"></span>${esc(z.name)} <span class="faint">· ${TYPE_META[z.type].label} ${z.min}–${z.max}${z.active ? '' : ' · выкл.'}</span></label>`).join('');
  openLayer(`<div class="modal"><div class="dhd"><h3>Раздать зоны по сотам · ${esc(c.name)}</h3><button class="x" onclick="closeLayer()"><svg class="ic"><use href="#i-close"/></svg></button></div>
    <div class="dbd" style="display:grid;grid-template-columns:1fr 280px;gap:24px">
      <div><div class="muted" style="margin-bottom:8px">Какие зоны получат территории в этом городе. Каждой достаётся свой центр, сота уходит ближайшему; зоны не накладываются.</div><div class="mobs" id="zlist">${list}</div></div>
      <div style="display:flex;flex-direction:column;gap:16px">
        <div class="field"><label>Seed</label><div style="display:flex;gap:6px"><input class="input mono" id="seedIn" value="${c.seed}"><button class="btn" onclick="document.getElementById('seedIn').value=Math.floor(Math.random()*1e6)">Перемешать</button></div><div class="hint">Тот же seed и состав → та же раскладка.</div></div>
        <div class="field"><label>Сот в городе</label><div class="num">${c.territories.length}</div></div>
        <div class="alert warn" style="font-size:12px"><svg class="ic"><use href="#i-warn"/></svg>Раздача перезапишет ручную покраску всех сот. Дырки-анклавы отдаются окружающей зоне.</div>
      </div></div>
    <div class="dft"><button class="btn" onclick="closeLayer()">Отмена</button><button class="btn primary" onclick="applyAssign('${c.id}')"><svg class="ic"><use href="#i-dice"/></svg>Раздать</button></div></div>`);
}
function applyAssign(cid) {
  const c = CITIES.find(x => x.id === cid);
  c.zoneIds = [...document.querySelectorAll('input[name=zs]:checked')].map(i => i.value); c.seed = +document.getElementById('seedIn').value || 1;
  assignZones(c.territories, c.zoneIds, c.seed); closeLayer(); toast(`Роздано: ${c.zoneIds.length} зон по ${c.territories.length} сотам`); render();
}
function citySpawns(c) {
  const rows = (c.territories || []).filter(t => t.zoneId).flatMap(t => spawnsFor(c, t).map((p, k) => { const z = zoneById(t.zoneId); const m = z.monsters[(t.i + t.j + k) % z.monsters.length]; return { z, t, m, pack: 1 + ((t.i * 3 + k) % 3 === 0 ? 1 : 0) + ((t.j + k) % 5 === 0 ? 1 : 0), kills: (t.i * t.j + k) % 4 }; })).slice(0, 14);
  return `<div class="tw"><table><thead><tr><th>Моб</th><th>Зона</th><th>Сота</th><th class="r">Пак</th><th>Координаты</th><th class="r">Убит</th></tr></thead><tbody>
    ${rows.map(r => `<tr><td><b>${esc(MONSTERS[r.m].split(' · ')[0])}</b> <span class="faint">${MONSTERS[r.m].split(' · ')[1]} ур.</span></td><td>${esc(r.z.name)}</td><td class="mono">${r.t.i}:${r.t.j}</td><td class="r num">${r.pack > 1 ? '×' + r.pack : '—'}</td><td class="mono">55.76${String(r.t.j).padStart(2, '0')}, 37.5${String(700 + r.t.i).slice(-3)}</td><td class="r num">${r.kills}</td></tr>`).join('')}
  </tbody></table></div><div class="faint" style="margin-top:8px">Показаны первые ${rows.length} из ${cityStats(c).spawns} — GET /admin/spawn/active?cityId=…</div>`;
}

// ---------- Зоны ----------
function renderZones() {
  const rows = ZONES.map(z => {
    const cnt = zoneTerrCount(z.id), cities = zoneCities(z.id);
    const badLvl = z.monsters.some(m => { const l = +MONSTERS[m].split(' · ')[1]; return l < z.min || l > z.max; });
    return `<tr onclick="openZone('${z.id}')">
      <td><span class="sw" style="display:inline-block;width:10px;height:10px;border-radius:2px;background:${z.color};margin-right:8px;vertical-align:middle"></span><b>${esc(z.name)}</b></td>
      <td>${typeTag(z.type)}</td><td class="num">${z.min}–${z.max}</td>
      <td class="num">${z.monsters.length}${badLvl ? ' <span class="tag warn" title="Есть моб вне диапазона уровней">!</span>' : ''}</td>
      <td class="r num">${z.capacity ?? `<span class="faint">${DEFAULT_CAP}</span>`}</td>
      <td class="num">${cnt ? `${cnt} <span class="faint">· ${cities.join(', ')}</span>` : '<span class="faint">нигде</span>'}</td>
      <td>${z.arena ? '<span class="tag ok">Есть</span>' : '<span class="tag off">Нет</span>'}</td>
      <td>${statusTag(z.active)}</td>
      <td class="r"><button class="btn link" onclick="event.stopPropagation();openZone('${z.id}')">Открыть</button></td></tr>`;
  }).join('');
  const used = ZONES.filter(z => zoneTerrCount(z.id)).length;
  return `
    <div style="display:flex;justify-content:space-between;align-items:center;gap:12px">
      <div class="muted">Зона — логическая единица: тип, уровни, пул мобов, фон арены, лимит на соту. Где она на карте — решают территории городов.</div>
      <button class="btn primary" onclick="openZone(null)"><svg class="ic"><use href="#i-plus"/></svg>Новая зона</button></div>
    <div class="stats">
      <div class="stat"><div class="lbl">Зон</div><div class="val num">${ZONES.length}<small>активных ${ZONES.filter(z => z.active).length}</small></div><div class="sub">заводятся сидом и здесь</div></div>
      <div class="stat"><div class="lbl">С территориями</div><div class="val num">${used}<small>из ${ZONES.length}</small></div><div class="sub">остальные — в резерве, ждут города</div></div>
      <div class="stat"><div class="lbl">Лимит по умолчанию</div><div class="val num">${DEFAULT_CAP}<small>спауна на соту</small></div><div class="sub">env TERRITORY_CAPACITY</div></div>
      <div class="stat"><div class="lbl">Уровни</div><div class="val num">1–10</div><div class="sub">описательные, бой не проверяет</div></div>
    </div>
    <div class="card"><div class="tw"><table><thead><tr><th>Зона</th><th>Тип</th><th>Уровни</th><th>Мобов</th><th class="r">На соту</th><th>Территорий</th><th>Арена</th><th>Статус</th><th></th></tr></thead><tbody>${rows}</tbody></table></div></div>`;
}
function openZone(id) {
  const z = id ? zoneById(id) : null; S.zoneTab = 'main';

    const cnt = z ? zoneTerrCount(z.id) : 0;
    const tabs = [['main', 'Основное'], ['mobs', 'Мобы', !z], ['arena', 'Арена', !z], ['where', 'Где на карте', !z]];
    const body = S.zoneTab === 'main' ? `<div class="form">
        <div class="field full"><label>Название</label><input class="input" value="${z ? esc(z.name) : 'Frostbound Pass'}"></div>
        <div class="field"><label>Тип</label><select class="input">${Object.entries(TYPE_META).map(([k, m]) => `<option ${z && z.type === k ? 'selected' : ''}>${m.label} · ${k}</option>`).join('')}</select></div>
        <div class="field"><label>Спаунов на соту в неделю</label><input class="input num" value="${z && z.capacity != null ? z.capacity : ''}" placeholder="по умолчанию ${DEFAULT_CAP}"><div class="hint">0 — зона без мобов (декоративная). Умножается на число её сот.</div></div>
        <div class="field"><label>Мин. уровень</label><input class="input num" value="${z ? z.min : 9}"></div>
        <div class="field"><label>Макс. уровень</label><input class="input num" value="${z ? z.max : 10}"></div>
        <div class="field"><label>Спаунить</label><div><button class="switch ${!z || z.active ? 'on' : ''}" onclick="this.classList.toggle('on')"></button></div><div class="hint">Выключенная зона: её соты остаются за ней, но пустые.</div></div>
        <div class="full"><button class="btn primary" onclick="toast('Сохранено'); ${z ? '' : 'closeLayer();'}">${z ? 'Сохранить' : 'Создать'}</button></div>
        ${z ? `<div class="full" style="border-top:1px solid var(--border);padding-top:16px;display:flex;justify-content:space-between;align-items:center;gap:12px"><div><b>Удалить зону</b><div class="hint">${cnt ? `${cnt} сот в ${zoneCities(z.id).join(', ')} останутся без зоны, их спауны исчезнут.` : 'Территорий у зоны нет.'}</div></div><button class="btn danger"><svg class="ic"><use href="#i-trash"/></svg>Удалить</button></div>` : ''}

      : `<div class="muted">Зона на карте живёт только через соты городов. Здесь — только чтение, красить — в городе.</div><div class="tw"><table><thead><tr><th>Город</th><th class="r">Сот</th><th class="r">Спаунов / нед.</th><th></th></tr></thead><tbody>${CITIES.filter(c => (c.territories || []).some(t => t.zoneId === z.id)).map(c => { const n = c.territories.filter(t => t.zoneId === z.id).length; return `<tr><td>${esc(c.name)}</td><td class="r num">${n}</td><td class="r num">${n * zoneCap(z)}</td><td class="r"><button class="btn link" onclick="closeLayer();S.tab='territories';location.hash='cities/${c.id}'">На карту</button></td></tr>`; }).join('') || '<tr><td colspan="4" class="empty">Ни один город не отдал зоне территорию</td></tr>'}</tbody></table></div>`;

// ---------- Спаун ----------

  return `<div style="display:flex;justify-content:space-between;align-items:center;gap:12px"><div class="muted">Недельный respawn: среда 00:00 UTC. Состав зон — в «Зонах», раскладка по карте — в «Городах».</div><button class="btn primary" onclick="respawnAll()"><svg class="ic"><use href="#i-play"/></svg>Перезапустить спаун</button></div>
    <div class="stats">
      <div class="stat"><div class="lbl">Спаунить глобально</div><div class="val"><button class="switch on" onclick="this.classList.toggle('on')"></button></div><div class="sub">SPAWN_ENABLED</div></div>
      <div class="stat"><div class="lbl">Живых спаунов</div><div class="val num">${tot.spawns}</div><div class="sub">по ${tot.terr} сотам с зоной</div></div>
      <div class="stat"><div class="lbl">Городов в respawn</div><div class="val num">${CITIES.filter(c => c.active && cityStats(c).assigned).length}</div><div class="sub">активные с сотами и зонами</div></div>
      <div class="stat"><div class="lbl">Следующий</div><div class="val">ср 16.09</div><div class="sub">00:00 UTC</div></div></div>
    <div class="card"><div class="hd">Последний прогон · ср 09.09 00:00 UTC</div><div class="tw"><table><thead><tr><th>Город</th><th class="r">Сот с зоной</th><th class="r">Спаунов</th><th>Пропущено</th></tr></thead><tbody>
      ${CITIES.map(c => { const s = cityStats(c); return `<tr onclick="location.hash='cities/${c.id}'"><td>${esc(c.name)}</td><td class="r num">${s.assigned || '—'}</td><td class="r num">${c.active ? s.spawns : '—'}</td><td class="muted">${!c.boundary ? 'нет границы' : !s.terr ? 'не разбит' : !c.active ? 'город выключен' : !s.assigned ? 'нет сот с зоной' : ''}</td></tr>`; }).join('')}
    </tbody></table></div></div>`;
}

// ---------- слои ----------
function openLayer(html) { document.getElementById('layer').innerHTML = `<div class="overlay ${html.startsWith('<div class="modal"') ? 'center' : ''}" onclick="if(event.target===this)closeLayer()">${html}</div>`; }
function closeLayer() { document.getElementById('layer').innerHTML = ''; }
function openNotes() {
  openLayer(`<div class="notes"><div class="dhd"><h3>Заметки прототипа</h3><button class="x" onclick="closeLayer()"><svg class="ic"><use href="#i-close"/></svg></button></div><div class="dbd">
    <div class="tree">
      <div><b>Город</b>граница мира (MultiPolygon), ребро соты, «спаунить». Заводится в админке, обводится на карте.</div>
      <div><b>Зона</b>имя, тип, уровни, пул мобов, арена, лимит на соту. Без геометрии. Заводится сидом, правится в «Зонах».</div>
      <div><b>Территория</b>сота гексагональной сетки города. Единственное свойство — зона (или пусто). В ней спаунятся мобы.</div></div>
    <h4>Что изменилось против «Зон» этапов 6–7</h4>
    <ul><li>Геометрия уходит с зоны на территорию; <code>SpawnZone.geometry</code> и <code>PUT zones/:id/geometry</code> удаляются.</li>
      <li>Генератор сот переезжает в город: «Разбить на соты» + «Раздать зоны» (тот же farthest-point, seed, анклавы) + ручная кисть.</li>
      <li>Лимит зоны — теперь «спаунов на соту в неделю» (env <code>TERRITORY_CAPACITY</code>, по умолчанию 2), а не на всю зону.</li>
      <li>Одна зона может жить в нескольких городах; зона без сот — в резерве.</li>
      <li>Пропуск в respawn: нет границы, не разбит, город выключен, сота без зоны, зона выключена.</li></ul>
    <h4>Ограничения</h4>
    <ul><li>Ребро соты 100–5000 м, потолок 20 000 сот на город.</li><li>Граница — 1–32 контура, до 256 вершин на контур.</li><li>Клиентский контракт <code>/map/zones</code> и <code>/map/entities</code> не меняется; полигоны сот клиенту — позже.</li></ul>
    <p>Спека: <span class="mono">troy-docs/roadmap/cities/README.md</span></p>
  </div></div>`);
}

route();
